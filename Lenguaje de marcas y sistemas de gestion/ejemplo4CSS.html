<!DOCTYPE html>
<html>
    <head>
        <title>ejemplo 4 css id</title>
        <style>
            .rojo{
                color: red;
            }
        </style>

    </head>
    <body>
        <!--Para diferentes elementos usamos class y en el style para referirnos a la clase usamos .-->
        <!--se van a aplicar diferentes reglas a etiquetas del mismo tipo-->
        <h3 class="rojo">Encabezado rojo</h3>
        <p class="rojo">párrafo rojo</p>
    </body>
</html>
