<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo Abre Ventana Nueva</title>
        <script>
            function cerrarse(){
                self.close();
            }
        </script>
    </head>
    <body>
        <h1>Ventana popup</h1>
        <form>
            <input type="button" value="Cerrar" onclick="cerrarse()">
        </form>
    </body>
</html>
