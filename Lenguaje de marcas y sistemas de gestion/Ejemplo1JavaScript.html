<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Ejemplo 1 javaScript
        </title>
        <script type="text/javaScript">//Habitualmente se crean las funciones en el head y en el body se llaman a las funciones
           function producto(a,b) {
            return a*b;
           }
        </script>
    </head>
    
    <body>
        <script>
            alert("Resultado: "+producto(5,6));//crea un pop up de alerta y muestra lo que le digas
            document.write("Resultado de la multiplicacion: " + producto(8,7)); //Escribe directamente en el documento
            
        </script>
    </body>
</html>
