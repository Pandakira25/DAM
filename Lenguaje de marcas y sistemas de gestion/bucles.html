<!DOCTYPE html>
<head>

    <title>Bucles JavaScript</title>
</head>
<body>
    <script>
        for(let i = 0; i < 10; i++){
            document.write("Valor: " + i + "<br>");
        }

        let numero1 = 15;
        let numero2 = 20;
        while(numero2>numero1){
            --numero2;
            alert("El valor de número 2 (while) es: " + numero2);
        }

        numero1 = 15;
        numero2 = 14;
        do{
            alert("el valor de número2 (do while) es: " + número2);
        }while(numero2>numero1);

        /* -------------------------------------------*/

        };

        Array[0] = "Ford";

        document.write("Longitud: " + Array.length + "<br>");

        document.write(persona.colorOjos);

        }
