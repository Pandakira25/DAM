<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Actividad 10/12/25</title>
    </head>

    <body>
        <script>
            let nombre = prompt ('¿cuál es tu nombre?') ;
            let apellido = prompt('¿cuál es tu apellido'); 
            let edad = eval(prompt('¿cuál es tu edad?'));

            alert("Hola Mr " + apellido);

            document.write("<h1>"+nombre + " " + apellido + "</h1>");

            document.write("<p>Tengo " + edad + " años, dentro de 5 tendré " + eval(edad + 5) + "</p>");

            //document.write si salta de línea

            //confirm es para aceptar o cancelar devuelve un booleano
           if(confirm('Muchas Gracis, ¿Desea continuar?')){
                alert('Esto es todo amigos!!');
            }else{
                alert('Se acabó!');
            }
            
        </script>
    </body>
</html>
