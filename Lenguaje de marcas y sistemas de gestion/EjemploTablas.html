<!DOCTYPE html>

<head>
    <title>Ejemplo tablas</title>
</head>

<body>
    <table border="3" cellspacing="10px" cellpadding="10" width="50%" bordercolor="red"><!--Bordes Externos frame="box"  Bordes Internos rules="cols"-->
        <caption align="bottom">Título de la tabla</caption><!--Título de la tabla-->
        <tfoot><!--Celdas al final de la tabla-->
            <td>Final 1</td>
            <td>Final 2</td>
            <td>Final 3</td>
        </tfoot>
        <tbody>
            <tr align="right" valign="top" bgcolor="#EABCF5" >
                <td width="100" height="500">Celda 1</td>
                <td align="center" bgcolor="red" colspan="2">Celda 2</td><!--Para que la celda se expanda hacia abajo rowspan="2"-->
            </tr>
            <tr><!--tr son las filas-->
                <td bgcolor="#EABCF5">Celda 3</td> <!--td son las columnas-->
                <td>Celda 4</td>
                <td>Celda 5</td>
            </tr>
        </tbody>

        <thead>
            <th colspan="3">col1</th> <!--Para que una columna ocupe tres-->
        </thead>

        <tr>

        </tr>
    </table>
</body>
